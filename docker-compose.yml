# =============================================================================
# Docker Compose for swf-monitor + swf-testbed
# =============================================================================
# Starts the full testbed stack:
#   - PostgreSQL 16  (primary database)
#   - Redis 7        (Django Channels layer for SSE relay)
#   - ActiveMQ Artemis (message broker)
#   - swf-monitor    (Django web application)
#   - swf-testbed    (CLI: agents + workflow orchestration)
#
# Usage:
#   cp ../swf-monitor/.env.example ../swf-monitor/.env   # then edit (at minimum set SECRET_KEY)
#   docker compose up -d --build
#   docker compose logs -f testbed
# =============================================================================

networks:
  # Name the project default network so the merged panda-compose services
  # (which declare no networks and therefore attach to the default) share it
  # with the testbed agents. Without this, testbed and panda-compose land on
  # separate networks and agents cannot reach rucio / panda-server by name.
  default:
    name: swf-network
    driver: bridge

services:
  # ---------- infrastructure --------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-swfdb}
      POSTGRES_USER:     ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your_db_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  testbed-activemq:
    image: apache/activemq-artemis:latest-alpine
    restart: unless-stopped
    ports:
      - "8163:8161"    # Web console (admin/admin)
      - "61617:61616"  # Core protocol
      - "61614:61613"  # STOMP
    environment:
      ARTEMIS_USER:     admin
      ARTEMIS_PASSWORD: admin
    volumes:
      - amqdata:/var/lib/artemis-instance
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8161/console/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------- application -----------------------------------------------------
  web:
    build:
      context: ../swf-monitor/
      dockerfile: ../swf-monitor/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../swf-monitor/.env
    environment:
      # Override connection hosts to point at Docker service names.
      DB_HOST:     db
      DB_PORT:     "5432"
      DB_NAME:     ${DB_NAME:-swfdb}
      DB_USER:     ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-your_db_password}
      REDIS_URL:   redis://redis:6379/0
      ACTIVEMQ_HOST: testbed-activemq
      ACTIVEMQ_PORT: "61613"
      # Allow inter-container requests (testbed agents connect via service name)
      SWF_ALLOWED_HOSTS: localhost,127.0.0.1,web,testserver
      # Django superuser (created automatically on first start)
      DJANGO_SUPERUSER_USERNAME:  ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL:     ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      DJANGO_SUPERUSER_PASSWORD:  ${DJANGO_SUPERUSER_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  testbed:
    build:
      context: ../               # monorepo root (needs swf-common-lib, swf-monitor, swf-testbed)
      dockerfile: swf-testbed/Dockerfile
    # Override the Dockerfile CMD so the workflow name can be injected at
    # runtime via the TESTBED_WORKFLOW environment variable.
    # Default: stf_datataking  (matches the Dockerfile CMD fallback)
    command: testbed run ${TESTBED_WORKFLOW:-stf_datataking}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      testbed-activemq:
        condition: service_healthy
      web:
        condition: service_healthy
      panda-server:
        condition: service_healthy
      rucio:
        condition: service_healthy
    env_file:
      - ../swf-monitor/.env
    environment:
      # /app is the swf-testbed source root; workflows/ lives there
      PYTHONPATH: /app
      # Database (used by manage.py get_token in the entrypoint)
      DB_HOST:     db
      DB_PORT:     "5432"
      DB_NAME:     ${DB_NAME:-swfdb}
      DB_USER:     ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-your_db_password}
      # Broker
      ACTIVEMQ_HOST: testbed-activemq
      ACTIVEMQ_PORT: "61613"
      ACTIVEMQ_WEB_PORT: "8163"
      # Monitor URL (agents report back here)
      SWF_MONITOR_URL: http://web:8000
      SWF_MONITOR_HTTP_URL: http://web:8000
      # Redis
      REDIS_URL: redis://redis:6379/0
      # PanDA Configuration (for prompt_processing_agent)
      PANDA_URL: http://panda-server:80/server/panda
      # Dev stack has no TLS: point the SSL URL at http too so panda-client
      # requests skip all SSL/cert handling (Client._build_ssl_context returns
      # False for non-https URLs).
      PANDA_URL_SSL: http://panda-server:80/server/panda
      X509_USER_PROXY: /dev/null
      # x509_no_grid makes PsubUtils.check_proxy() return early, so PrunScript
      # (invoked to build task params) does NOT try to generate a grid proxy,
      # which would otherwise prompt for a passphrase and hang in CI.
      PANDA_AUTH: x509_no_grid
      PANDA_VERIFY_HOST: off
      # The panda-compose stack (queues + harvester) runs under the wlcg VO;
      # match it so submitted tasks broker to the E1_BNL / E1_JLAB queues.
      SWF_PANDA_VO: wlcg
      # Rucio Configuration (for data_agent). The rucio Python client reads a
      # config file, not these vars; RUCIO_CONFIG points at the client cfg baked
      # into the image (config/rucio.cfg -> /app/config/rucio.cfg). The agent
      # itself defaults to scope group.daq and RSE DAQ_DISK_3 (see
      # agents.supervisord.conf); the CI bootstrap provisions both.
      RUCIO_CONFIG: /app/config/rucio.cfg
      RUCIO_ACCOUNT: root
      RUCIO_SCOPE: group.daq
      RUCIO_RSE: DAQ_DISK_3
      # Decision Box / Prompt Processing
      SWF_DECISION_BOX_ENABLED: "false"
      SWF_DECISION_BOX_RUCIO_SCOPE: group.daq
      SWF_DECISION_BOX_SITES: E1_BNL,E1_JLAB
      SWF_DECISION_BOX_POLICY: round-robin
      SWF_NON_DECISION_BOX_SITE: E1_BNL
      SWF_PROMPT_PROCESSING_BACKGROUND: "false"
    volumes:
      # Shared with the panda-compose rucio server so posix-RSE uploads land
      # where the server can see them (both RSEs use prefix /tmp/rucio_rse).
      - rucio-rse-data:/tmp/rucio_rse

volumes:
  pgdata:
  redisdata:
  amqdata:
