[testbed]
namespace = "test-user"

[workflow]
name = "prompt_processing"
version = "1.0"
description = "Prompt processing of STF files"
config = "prompt_processing_default"
includes = ["daq_state_machine.toml"]

# =============================================================================
# Agent Configuration
# =============================================================================
[agents.stf-data]
enabled = true
script = "agents/data_agent.py"

[agents.stf-processing]
enabled = true
script = "agents/prompt_processing_agent.py"

# =============================================================================
# Prompt Processing Parameters (used by prompt_processing.py)
# =============================================================================
[simulation]
# STF generation parameters
stf_count = 3                   # Number of STF files to generate
physics_period_count = 1        # Number of physics periods

# Timing parameters
realtime = true                 # Run in real-time (1 sim second = 1 wall second)

# Glob pattern for real data files to copy as STFs (cycles through matches).
# When unset, JSON stubs are written instead.
# stf_source_pattern = "/cvmfs/eic.opensciencegrid.org/testbed/epic/FULL/26.03.0/epic_craterlake/Bkg_Exact1S_2us/GoldCt/10um/DIS/NC/10x100/minQ2=1/pythia8NCDIS_10x100_minQ2=1_beamEffects_xAngle=-0.025_hiDiv_1.*.edm4hep.root"

# Destination filename pattern using str.format() syntax.
# stf_destination_pattern = "swf.{run_id}.{counter:06d}.edm4hep.root"

[prompt_processing]
# Optional shared output root for generated STF files.
# Leave empty in the shared config. Users can override via:
# 1. SWF_TESTBED_CONFIG with [prompt_processing].container
# 2. SWF_PROMPT_PROCESSING_CONTAINER=/data/<user>/<folder>
container = ""

# Environment variables SWF_PANDA_POLL_INTERVAL and SWF_PANDA_POLL_TIMEOUT
# remain supported as operational overrides.
panda_poll_interval_seconds = 60
panda_poll_timeout_seconds = 0

# Keep the STOMP receiver thread responsive while PanDA submission runs.
# Enable with SWF_PROMPT_PROCESSING_BACKGROUND=true or set this to true.
background_stf_ready = true

# Keep the data-agent STOMP receiver responsive while STF upload, Rucio attach,
# swf-monitor registration, and first-site stf_ready notification run.
background_stf_gen = true

# How long end_run waits for already received STF workers for the same run.
# 0 means wait indefinitely; SWF_DATA_END_RUN_WAIT_TIMEOUT overrides this.
data_end_run_wait_timeout_seconds = 0

# Decision box: data agent creates site-specific open input datasets and sends
# stf_ready once the first selected STF DID is attached for a site.
non_decision_box_site = "E1_BNL"
decision_box_enabled = true
decision_box_policy = "round-robin"
decision_box_sites = ["E1_BNL", "E1_JLAB"]
decision_box_rucio_scope = "group.daq"
decision_box_site_dataset_template = "run.{run_number}.{site_name}"
