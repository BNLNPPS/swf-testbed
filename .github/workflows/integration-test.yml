# =============================================================================
# Integration test: bring up the full Docker Compose stack and verify that
# each supported workflow runs to completion.  Runs as a matrix so
# stf_datataking and prompt_processing are tested in parallel.
# =============================================================================
name: Integration Test

on:
  workflow_call:
    inputs:
      swf_testbed_repo:
        description: 'owner/repo of swf-testbed to check out'
        required: false
        type: string
        default: BNLNPPS/swf-testbed
      swf_testbed_ref:
        description: 'Git ref (branch, tag, or SHA) of swf-testbed to check out'
        required: true
        type: string
      swf_monitor_repo:
        description: 'owner/repo of swf-monitor to check out'
        required: false
        type: string
        default: BNLNPPS/swf-monitor
      swf_monitor_ref:
        description: 'Git ref (branch, tag, or SHA) of swf-monitor to check out'
        required: true
        type: string
      swf_common_lib_repo:
        description: 'owner/repo of swf-common-lib to check out'
        required: false
        type: string
        default: BNLNPPS/swf-common-lib
      swf_common_lib_ref:
        description: 'Git ref of swf-common-lib to check out'
        required: false
        type: string
        default: main
      panda_compose_repo:
        description: 'owner/repo of panda-compose to check out'
        required: false
        type: string
        default: PanDAWMS/panda-compose
      panda_compose_ref:
        description: 'Git ref of panda-compose to check out'
        required: false
        type: string
        default: main
  workflow_dispatch:
    inputs:
      swf_testbed_repo:
        description: 'owner/repo of swf-testbed'
        required: false
        type: string
        default: BNLNPPS/swf-testbed
      swf_testbed_ref:
        description: 'Git ref of swf-testbed to check out'
        required: true
        type: string
        default: main
      swf_monitor_repo:
        description: 'owner/repo of swf-monitor'
        required: false
        type: string
        default: BNLNPPS/swf-monitor
      swf_monitor_ref:
        description: 'Git ref of swf-monitor to check out'
        required: true
        type: string
        default: main
      swf_common_lib_repo:
        description: 'owner/repo of swf-common-lib'
        required: false
        type: string
        default: BNLNPPS/swf-common-lib
      swf_common_lib_ref:
        description: 'Git ref of swf-common-lib to check out'
        required: false
        type: string
        default: main
      panda_compose_repo:
        description: 'owner/repo of panda-compose to check out'
        required: false
        type: string
        default: PanDAWMS/panda-compose
      panda_compose_ref:
        description: 'Git ref of panda-compose to check out'
        required: false
        type: string
        default: main

env:
  DB_NAME:     swfdb
  DB_USER:     admin
  DB_PASSWORD: testpassword
  DJANGO_SUPERUSER_USERNAME:  admin
  DJANGO_SUPERUSER_EMAIL:     admin@example.com
  DJANGO_SUPERUSER_PASSWORD:  changeme
  # Maximum time (seconds) to wait for the success message
  TIMEOUT: 600
  # Stable project name so container names stay <project>-<service>-1 regardless
  # of the --project-directory override used on each compose command. That
  # override points at ../panda-compose so panda-compose's relative volume
  # paths (./config, ./scripts) resolve against its own checkout rather than
  # swf-testbed's; swf-testbed's own ../sibling paths resolve the same either way.
  COMPOSE_PROJECT_NAME: swf-testbed
  # Merge swf-testbed's compose file with panda-compose's on every command.
  # Paths are relative to the working directory of each compose invocation
  # (always swf-testbed). Validated byte-identical to the -f/-f invocation.
  COMPOSE_FILE: docker-compose.yml:../panda-compose/docker-compose.yml

jobs:
  integration:
    name: ${{ matrix.testbed_workflow }}${{ matrix.decision_box && ' + decision box' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      # Run both workflow variants, plus a decision-box variant of
      # prompt_processing (per-site datasets and two PanDA tasks), reporting
      # each result independently. The idds leg runs the official iDDS
      # client against the panda-compose iDDS service (see
      # scripts/test_idds_client.py) without starting a testbed workflow.
      fail-fast: false
      matrix:
        testbed_workflow: [stf_datataking, prompt_processing]
        decision_box: [false]
        idds_client: [false]
        include:
          - testbed_workflow: prompt_processing
            decision_box: true
            idds_client: false
          - testbed_workflow: idds_client
            decision_box: false
            idds_client: true

    # Cancel in-progress runs for the same branch/PR, workflow variant, and
    # decision-box mode.
    concurrency:
      group: integration-${{ github.ref }}-${{ matrix.testbed_workflow }}-${{ matrix.decision_box }}
      cancel-in-progress: true

    steps:
      # ---- 1. Check out all three sibling repos ----
      #
      # The docker-compose.yml and Dockerfile expect:
      #   <workspace>/
      #     swf-common-lib/
      #     swf-monitor/
      #     swf-testbed/          ← docker-compose.yml lives here
      #
      - name: Checkout swf-testbed
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.swf_testbed_repo }}
          ref: ${{ inputs.swf_testbed_ref }}
          path: swf-testbed

      - name: Checkout swf-monitor
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.swf_monitor_repo }}
          ref: ${{ inputs.swf_monitor_ref }}
          path: swf-monitor

      - name: Checkout swf-common-lib
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.swf_common_lib_repo }}
          ref: ${{ inputs.swf_common_lib_ref }}
          path: swf-common-lib

      - name: Checkout panda-compose
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.panda_compose_repo }}
          ref: ${{ inputs.panda_compose_ref }}
          path: panda-compose

      # ---- 2. Create the .env file that web & testbed containers need ----
      #
      # Both services declare  env_file: ../swf-monitor/.env  in compose.
      # The environment: block in compose already overrides most values, so
      # only SECRET_KEY and DEBUG are strictly needed here.
      - name: Create swf-monitor .env
        run: |
          cat > swf-monitor/.env <<EOF
          SECRET_KEY=ci-test-secret-key-not-for-production
          DEBUG=True
          DB_HOST=db
          DB_PORT=5432
          DB_NAME=swfdb
          DB_USER=admin
          DB_PASSWORD=testpassword
          REDIS_URL=redis://redis:6379/0
          ACTIVEMQ_HOST=activemq
          ACTIVEMQ_PORT=61613
          EOF
          # Strip leading whitespace that YAML block-scalar indentation adds
          sed -i 's/^[[:space:]]*//' swf-monitor/.env

      # ---- 2b. Create panda-compose .env ----
      #
      # Start from the upstream defaults (PostgreSQL, ActiveMQ, PanDA, Rucio)
      # and override the compute-queue list: the decision box fans work out
      # to E1_BNL / E1_JLAB, plus the built-in local queue. Also map the data
      # agent's upload RSE as a local DDM endpoint so JEDI job brokerage
      # classifies its replicas as local (see panda-compose render-cric.py);
      # without the mapping, --inDS input files stay 'unknown' and jobs never
      # activate once the ready-marking setupper patch is gone from the
      # panda-server image.
      - name: Create panda-compose .env
        run: |
          cp panda-compose/.env.example panda-compose/.env
          printf 'PANDA_QUEUES=PANDA_COMPOSE_LOCAL E1_BNL E1_JLAB\n' >> panda-compose/.env
          printf 'PANDA_CRIC_EXTRA_ENDPOINTS={"DAQ_DISK_3": {"token": "DAQ", "type": "OS_LOGS"}}\n' >> panda-compose/.env

      # ---- 3. Build all images ----
      #
      # Build first so the staged startup is fast.
      - name: Docker Compose build
        working-directory: swf-testbed
        run: docker compose --project-directory ../panda-compose build

      # ---- 3b. Start infrastructure (both PostgreSQL instances + both ActiveMQ) ----
      #
      # The panda-database image runs init scripts on first start which causes a
      # container restart (briefly unhealthy). The testbed's db starts fast.
      # We bring up all four infra services first and wait for both PostgreSQL
      # instances to reach a *stable* healthy state before starting dependents.
      - name: Start infrastructure (db, panda-postgres, activemq, testbed-activemq)
        working-directory: swf-testbed
        run: |
          docker compose --project-directory ../panda-compose up -d db postgres testbed-activemq activemq

      # ---- 3c. Wait for both PostgreSQL instances to be stably healthy ----
      #
      # panda-database restarts during init (RestartCount=1); we require
      # two consecutive healthy reads to avoid catching it mid-restart.
      - name: Wait for PostgreSQL stability
        working-directory: swf-testbed
        run: |
          # Require two consecutive healthy reads so we don't catch the
          # panda-database container mid-restart during its first init.
          wait_healthy_stable() {
            container=$1
            stable=0
            for _ in $(seq 1 60); do
              status=$(docker inspect --format '{{.State.Health.Status}}' "$container" 2>/dev/null || echo starting)
              echo "  $container health=$status"
              if [ "$status" = healthy ]; then
                stable=$((stable + 1))
                [ "$stable" -ge 2 ] && break
              else
                stable=0
              fi
              sleep 5
            done
            if [ "$stable" -lt 2 ]; then
              echo "ERROR: $container did not reach stable healthy state" >&2
              docker logs "$container" 2>&1 | tail -n 80 || true
              exit 1
            fi
          }
          echo "Waiting for testbed db (swf-testbed-db-1) to be stably healthy..."
          wait_healthy_stable swf-testbed-db-1
          echo "Waiting for panda postgres (swf-testbed-postgres-1) to be stably healthy..."
          wait_healthy_stable swf-testbed-postgres-1

      # ---- 3d. Start PanDA + Rucio servers (and their dependencies) ----
      #
      # Bring these up before the testbed application container so we can
      # bootstrap Rucio (create RSEs/scopes/quota) *before* the data agent
      # starts. The data agent calls get_rse() at init and crash-loops into a
      # supervisor FATAL state if its target RSE does not yet exist.
      - name: Start PanDA and Rucio servers
        working-directory: swf-testbed
        run: |
          docker compose --project-directory ../panda-compose up -d panda-server rucio

      # ---- 3e. Wait for Rucio, then bootstrap RSEs / scopes / quota ----
      #
      # The data agent defaults to scope group.daq and RSE DAQ_DISK_3; the
      # harvester RucioStager expects MOCK-POSIX. Provision both. bootstrap-rucio.sh
      # is idempotent (accepts HTTP 409 already-exists).
      - name: Bootstrap Rucio
        working-directory: swf-testbed
        run: |
          rucio_container=swf-testbed-rucio-1
          echo "Waiting for Rucio ($rucio_container) to become healthy..."
          for _ in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$rucio_container" 2>/dev/null || echo starting)
            echo "  rucio health=$status"
            [ "$status" = healthy ] && break
            sleep 5
          done
          if [ "$status" != healthy ]; then
            echo "ERROR: Rucio did not become healthy" >&2
            docker logs "$rucio_container" 2>&1 | tail -n 80 || true
            exit 1
          fi
          # MOCK-POSIX (harvester stager) + the extra scopes it uses.
          # user.root: JEDI registers task output datasets/containers under the
          # submitter's scope (PANDA_NICKNAME=root -> user.root.*); without it,
          # GenTaskRefiner cannot register the output and the task stays 'waiting'.
          SCOPES="user.alice user.root mock group.daq" \
            bash ../panda-compose/scripts/bootstrap-rucio.sh "$rucio_container"
          # DAQ_DISK_3 (data agent default target RSE) under scope group.daq.
          RSE_NAME=DAQ_DISK_3 SCOPES="group.daq" \
            bash ../panda-compose/scripts/bootstrap-rucio.sh "$rucio_container"

      # ---- 3f. Start the rest of the stack ----
      #
      # Infrastructure and Rucio are ready; dependents' health conditions are
      # satisfied and the RSEs/scopes the data agent needs already exist.
      # The idds_client leg only exercises the panda-compose iDDS service;
      # the testbed container is started as an idle shell (its workflow
      # runner has no idds_client workflow, and the leg asserts from the
      # host via scripts/test_idds_client.py).
      - name: Start application stack (${{ matrix.testbed_workflow }})
        working-directory: swf-testbed
        env:
          TESTBED_WORKFLOW: ${{ matrix.testbed_workflow }}
          SWF_DECISION_BOX_ENABLED: ${{ matrix.decision_box }}
        run: |
          if [ "${{ matrix.idds_client }}" = "true" ]; then
            docker compose --project-directory ../panda-compose up -d --scale testbed=0
          else
            docker compose --project-directory ../panda-compose up -d
          fi


      # ---- 4. Wait for the success marker in testbed logs ----
      - name: Wait for workflow completion (${{ matrix.testbed_workflow }})
        if: ${{ matrix.idds_client != true }}
        working-directory: swf-testbed
        env:
          TESTBED_WORKFLOW: ${{ matrix.testbed_workflow }}
          SWF_DECISION_BOX_ENABLED: ${{ matrix.decision_box }}
          # The decision-box leg submits two PanDA tasks and must wait for
          # both sites' stf_processed messages; on a slow runner the
          # harvester's per-boot dnf/pip bootstrap alone can eat several
          # minutes (observed ~8 min at <100 kB/s), so give the listener a
          # wider window than the single-task legs. Healthy legs still exit
          # as soon as their message arrives; a larger timeout only costs
          # anything when the stack is already failing.
          LISTEN_TIMEOUT: ${{ matrix.decision_box && '900' || '600' }}
        run: |
          set -euo pipefail
          WORKFLOW="${TESTBED_WORKFLOW}"
          TIMEOUT=${TIMEOUT:-600}

          if [ "$WORKFLOW" = "stf_datataking" ]; then
            # stf_datataking: wait for DAQ simulation completion marker
            SUCCESS_MARKER="Workflow completed:"
            LOG_FILE="$(mktemp)"
            docker compose --project-directory ../panda-compose logs -f testbed > "$LOG_FILE" 2>&1 &
            LOGS_PID=$!

            ELAPSED=0
            INTERVAL=5
            while [ "$ELAPSED" -lt "$TIMEOUT" ]; do
              if grep -qF "$SUCCESS_MARKER" "$LOG_FILE" 2>/dev/null; then
                echo ""
                echo "=========================================="
                echo "✅  SUCCESS — Found '$SUCCESS_MARKER'"
                echo "=========================================="
                kill $LOGS_PID 2>/dev/null || true
                rm -f "$LOG_FILE"
                exit 0
              fi

              if ! docker compose --project-directory ../panda-compose ps testbed --format '{{.State}}' 2>/dev/null | grep -qi running; then
                echo ""
                echo "=========================================="
                echo "❌  FAILURE — testbed container stopped unexpectedly"
                echo "=========================================="
                docker compose --project-directory ../panda-compose logs --tail=100 testbed || true
                kill $LOGS_PID 2>/dev/null || true
                rm -f "$LOG_FILE"
                exit 1
              fi

              sleep "$INTERVAL"
              ELAPSED=$((ELAPSED + INTERVAL))
            done

            echo ""
            echo "=========================================="
            echo "❌  TIMEOUT — '$SUCCESS_MARKER' not seen within ${TIMEOUT}s"
            echo "=========================================="
            docker compose --project-directory ../panda-compose logs --tail=200 testbed || true
            kill $LOGS_PID 2>/dev/null || true
            rm -f "$LOG_FILE"
            exit 1

          elif [ "$WORKFLOW" = "prompt_processing" ]; then
            # prompt_processing: wait for stf_processed message on ActiveMQ
            # (validates end-to-end PanDA task submission + execution)
            echo "Waiting for stf_processed message (PanDA task completion)..."
            docker compose --project-directory ../panda-compose \
              exec -T testbed \
              python3 /app/scripts/listen_stf_processed.py
            exit $?
          else
            echo "Unknown workflow: $WORKFLOW" >&2
            exit 1
          fi

      # ---- 4b. Official iDDS client leg ----
      #
      # Install the pinned idds-client and run scripts/test_idds_client.py
      # against the stack's iDDS service: ping, get_status,
      # create_workflow_task (asserting the PanDA task lands in jedi_tasks),
      # adjust_worker and close_workflow_task.
      - name: iDDS client checks
        if: ${{ matrix.idds_client == true }}
        working-directory: swf-testbed
        run: |
          python -m venv /tmp/idds_ci_venv
          /tmp/idds_ci_venv/bin/pip install -q "idds-client==2.6.21"
          /tmp/idds_ci_venv/bin/python scripts/test_idds_client.py

      # ---- 5. Always dump logs for post-mortem debugging ----
      - name: Dump all service logs
        if: always()
        working-directory: swf-testbed
        run: |
          echo "::group::All service logs"
          docker compose --project-directory ../panda-compose logs --tail=500
          echo "::endgroup::"

      # ---- 6. Tear everything down ----
      - name: Docker Compose down
        if: always()
        working-directory: swf-testbed
        run: docker compose --project-directory ../panda-compose down -v --remove-orphans
